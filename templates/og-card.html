<!DOCTYPE html>
<!--
  Source for og-main.png. Render at 1200x630 and re-export whenever the
  homepage hero changes, otherwise link previews keep showing the old headline.

    node templates/render-og.mjs

  Fonts are inlined as base64 at render time so the card renders identically
  regardless of what's installed on the machine doing the export.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bebas Neue'; src: url(FONT_BEBAS) format('truetype'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url(FONT_BARLOW) format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #050505;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 48px 48px 18px 52px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  /* Faint scanlines, same texture as the site's hero */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.014) 0px,
      rgba(255,255,255,0.014) 1px,
      transparent 1px,
      transparent 34px
    );
  }

  .card > * { position: relative; }

  .bracket {
    position: absolute;
    top: 47px;
    left: 47px;
    width: 26px;
    height: 26px;
    border-top: 2px solid #41403b;
    border-left: 2px solid #41403b;
  }

  .wordmark {
    position: absolute;
    top: 48px;
    right: 48px;
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.2em;
    color: #41403b;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 170px;
    line-height: 0.885;
    letter-spacing: 0.005em;
    margin-left: 2px;
    margin-bottom: 42px;
  }

  .headline span { display: block; }
  .hl-blue { color: #4268ff; text-shadow: 6px 5px 0 #8e023a; }
  .hl-pink { color: #ff0066; text-shadow: 6px 5px 0 #021f82; }
  .hl-lime { color: #d4ff00; text-shadow: 6px 5px 0 #6d8202; }

  .eyebrow {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.235em;
    color: #716f66;
    margin-bottom: 10px;
  }

  .stripe {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    display: flex;
  }
  .stripe div { flex: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="bracket"></div>
    <div class="wordmark">BASTILLE ADVISORY</div>

    <h1 class="headline">
      <span class="hl-blue">WHAT YOU NEED</span>
      <span class="hl-pink">ISN'T ADVICE.</span>
      <span class="hl-lime">IT'S BANDWIDTH.</span>
    </h1>

    <div class="eyebrow">EMBEDDED OPERATOR FOR EARLY-STAGE TECH FOUNDERS</div>

    <div class="stripe">
      <div style="background:#0038ff"></div>
      <div style="background:#d4ff00"></div>
      <div style="background:#ff0066"></div>
    </div>
  </div>
</body>
</html>
